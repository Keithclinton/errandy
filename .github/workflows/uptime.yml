# Checks errandspot.com every 10 minutes. A failed run means the site was down for three checks
# in a row, and GitHub emails whoever last changed this schedule. (GitHub can start scheduled runs
# late, and pauses them after 60 days without commits; re-enable from the Actions tab.)
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check errandspot.com
        run: |
          check() {
            curl -fsS -m 20 -o /dev/null -w "home page %{http_code} in %{time_total}s\n" https://errandspot.com/ &&
              curl -fsS -m 20 -w "\n" "https://errandspot.com/api/health?db=1"
          }
          for attempt in 1 2 3; do
            if check; then exit 0; fi
            echo "::warning::check $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 45
          done
          echo "::error::errandspot.com is down: three checks in a row failed"
          exit 1
